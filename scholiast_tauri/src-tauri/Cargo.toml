[package]
name = "scholiast"
version = "0.4.1"
edition = "2021"
description = "Scholiast — lecture notes companion"

[lib]
name = "scholiast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# reqwest pinned to 0.12: 0.13's only rustls path is rustls-platform-verifier,
# which cannot initialize on Android without a JNI bridge + a Kotlin AAR in the
# gradle build, and hangs every HTTPS call without it. 0.12's
# `rustls-tls-webpki-roots` bundles its roots and works everywhere (same choice
# tauri-plugin-http makes).
reqwest = { version = "0.12", default-features = false, features = [
  "charset",
  "multipart",
  "rustls-tls-webpki-roots",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Pure-Rust JS engine for sig/n evaluation (rquickjs was dropped: its
# prebuilt bindings miss the Android targets and bindgen needs host
# libclang — see task 01 LOG).
boa_engine = { version = "0.22" }
scholiast-core = { path = "../crates/core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-mobile-sharetarget = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
whisper-rs = { version = "0.14", optional = true }

# --- Task 16 (Drive OAuth + keyring): appended deps; keep separate from the
# --- lists above (another wave owns target-specific sections).
getrandom = "0.3"
tokio = { workspace = true, features = ["net", "io-util"] }
dom_smoothie = "0.18.0"
encoding_rs = "0.8.35"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
wiremock = "0.6"

[features]
local-stt = ["dep:whisper-rs"]

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "0.18"
gtk = "0.18"
webkit2gtk = "2"

# No Android backend exists; `secrets.rs` falls back to an app-private file
# store there (see the android module TODO).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = [
  "apple-native",
  "sync-secret-service",
  "windows-native",
] }

[lints]
workspace = true
