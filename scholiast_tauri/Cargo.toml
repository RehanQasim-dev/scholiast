[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/server"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
