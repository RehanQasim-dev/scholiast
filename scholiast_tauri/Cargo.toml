[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/server"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Minimize target folder size and debug bloat
[profile.dev]
debug = 1 # Keep line tables for stack traces and panic backtraces

[profile.dev.package."*"]
debug = 0 # Strip heavy debug symbols from 3rd-party dependencies

# Whisper C++ matrix and tensor math must always run at -O3
[profile.dev.package.whisper-rs]
opt-level = 3

[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3

[workspace.lints.rust]
unused = "deny"
dead_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

