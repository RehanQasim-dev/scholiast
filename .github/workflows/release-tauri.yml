name: Release — Scholiast Tauri (deb + 3 APKs)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0-dark-obsidian-mint)"
        required: true
        type: string
      title:
        description: "Release title (leave empty to use tag)"
        required: false
        type: string
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsecret-1-dev patchelf

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend deps
        working-directory: scholiast_tauri
        run: pnpm install --frozen-lockfile

      - name: Build deb (release)
        working-directory: scholiast_tauri
        run: ./node_modules/.bin/tauri build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: scholiast_tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.2.13676358
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install frontend deps
        working-directory: scholiast_tauri
        run: pnpm install --frozen-lockfile

      - name: Install cargo-ndk (fallback, rust gradle plugin also works)
        run: cargo install cargo-ndk --locked || true

      - name: Build Android APKs (release per ABI, no universal, no x86)
        working-directory: scholiast_tauri
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./node_modules/.bin/tauri android build

      - name: List APKs
        run: ls -lh scholiast_tauri/src-tauri/gen/android/app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            scholiast_tauri/src-tauri/gen/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            scholiast_tauri/src-tauri/gen/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            scholiast_tauri/src-tauri/gen/android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error

  release:
    needs: [build-deb, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: ./artifacts

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: ./artifacts

      - name: List artifacts
        run: ls -lh ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title != '' && inputs.title || inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
