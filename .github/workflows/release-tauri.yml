name: Release — Scholiast Tauri (deb + 4 APKs)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0-dark-obsidian-mint)"
        required: true
        type: string
      title:
        description: "Release title (leave empty to use tag)"
        required: false
        type: string
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # Fast-fail gate (~2-4 min): typecheck + cargo check on host AND all Android
  # targets. A host-only check compiles the Linux cfg alone and misses
  # Android-only breakage (stale #[cfg(target_os = "linux")] gates, params
  # unused on non-Linux tripping `unused = "deny"`), which otherwise surfaces
  # 9-25 min into the build jobs. Both build jobs wait on this.
  quick-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Rust (host + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 28.2.13676358
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Linux deps (glib/webkit headers for host check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsecret-1-dev patchelf

      - name: Install frontend deps
        working-directory: scholiast_tauri
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: scholiast_tauri
        run: pnpm typecheck

      - name: Cargo check (host + 3 Android targets)
        working-directory: scholiast_tauri
        run: |
          NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android21-clang"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi21-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android21-clang"
          # cc-rs looks for <target>-ar on PATH; the NDK only ships llvm-ar.
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android
          cargo check --manifest-path src-tauri/Cargo.toml --target armv7-linux-androideabi
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-linux-android

  build-deb:
    needs: [quick-gates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsecret-1-dev patchelf

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend deps
        working-directory: scholiast_tauri
        run: pnpm install --frozen-lockfile

      - name: Verify frontend build
        working-directory: scholiast_tauri
        run: npx tsc --noEmit

      - name: Build deb (release)
        working-directory: scholiast_tauri
        run: ./node_modules/.bin/tauri build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Rename deb with release tag
        working-directory: scholiast_tauri
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          SAFE_TAG="${RELEASE_TAG//\//-}"
          ls target/release/bundle/deb/
          DEB=$(ls target/release/bundle/deb/*.deb | head -n 1)
          mv "$DEB" "target/release/bundle/deb/Scholiast-${SAFE_TAG}-amd64.deb"
          ls -lh target/release/bundle/deb/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: deb
          path: scholiast_tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-android:
    needs: [quick-gates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 28.2.13676358
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Remove unwanted i686 target (enforce 3 ABIs only)
        run: rustup target remove i686-linux-android || true

      - name: Install frontend deps
        working-directory: scholiast_tauri
        run: pnpm install --frozen-lockfile

      - name: Install cargo-ndk (fallback, rust gradle plugin also works)
        run: cargo install cargo-ndk --locked || true

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.jks \
            -alias scholiast \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass scholiast123 \
            -keypass scholiast123 \
            -dname "CN=Scholiast, OU=Engineering, O=Scholiast, L=Global, S=Global, C=US"

      - name: Build Android APKs (release per ABI + universal)
        working-directory: scholiast_tauri
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: scholiast123
          ANDROID_KEY_ALIAS: scholiast
          ANDROID_KEY_PASSWORD: scholiast123
          # Must match [lib] name in src-tauri/Cargo.toml: the mobile-sharetarget
          # plugin's BuildConfig.TAURI_LIBRARY_NAME comes from this property and a
          # missing/wrong value crashes the app on open (UnsatisfiedLinkError).
          ORG_GRADLE_PROJECT_tauri_app_lib_name: scholiast_lib
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # whisper-rs-sys runs bindgen without a target sysroot, so it parses
          # the HOST glibc headers (64-bit layouts) and the 32-bit armv7
          # bindings fail their size asserts. Point bindgen at the NDK sysroot
          # per target (same values as scholiast_tauri/scripts/env-android.sh).
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$SYSROOT --target=aarch64-linux-android24"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=$SYSROOT --target=armv7a-linux-androideabi24"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=$SYSROOT --target=x86_64-linux-android24"
          ./node_modules/.bin/tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64 --features local-stt
          ./node_modules/.bin/tauri android build --apk --target aarch64 armv7 x86_64 --features local-stt

      - name: List APKs
        run: find scholiast_tauri/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Sign, Align and Package APKs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p apk-dist
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          KEYSTORE="${{ github.workspace }}/release.jks"
          APK_DIR="scholiast_tauri/src-tauri/gen/android/app/build/outputs/apk"
          # Asset names inherit the release tag (slashes sanitized); never hardcode.
          SAFE_TAG="${RELEASE_TAG//\//-}"

          find_apk() {
            local flavor=$1
            find "$APK_DIR/$flavor/release" -name "*.apk" | head -n 1
          }

          sign_and_copy() {
            local flavor=$1
            local out_name=$2
            local src_apk
            src_apk=$(find_apk "$flavor")
            if [ -z "$src_apk" ] || [ ! -f "$src_apk" ]; then
              echo "Error: No APK found for $flavor in $APK_DIR/$flavor/release"
              exit 1
            fi
            echo "Processing $flavor APK: $src_apk -> apk-dist/$out_name"
            
            # Sign with apksigner enforcing v1, v2, and v3 schemes
            "$APKSIGNER" sign --ks "$KEYSTORE" \
              --ks-pass pass:scholiast123 \
              --key-pass pass:scholiast123 \
              --ks-key-alias scholiast \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "apk-dist/$out_name" \
              "$src_apk"

            # Strictly verify the signature
            echo "Verifying apk-dist/$out_name:"
            "$APKSIGNER" verify --verbose "apk-dist/$out_name"
          }

          sign_and_copy "arm64" "Scholiast-${SAFE_TAG}-arm64-v8a.apk"
          sign_and_copy "arm" "Scholiast-${SAFE_TAG}-armeabi-v7a.apk"
          sign_and_copy "x86_64" "Scholiast-${SAFE_TAG}-x86_64.apk"
          sign_and_copy "universal" "Scholiast-${SAFE_TAG}-universal.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: apks
          path: apk-dist/*.apk
          if-no-files-found: error

  release:
    needs: [build-deb, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download deb
        uses: actions/download-artifact@v7
        with:
          name: deb
          path: ./artifacts

      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          name: apks
          path: ./artifacts

      - name: List artifacts
        run: ls -lh ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title != '' && inputs.title || inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
