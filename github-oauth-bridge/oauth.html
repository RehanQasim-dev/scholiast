<!doctype html>
<!--
  Scholiast GitHub OAuth bridge page.
  Publish this file EXACTLY at the Callback URL registered on the GitHub App:
    https://rehanqasim-dev.github.io/scholiast-web/oauth.html
  (e.g. copy it to the scholiast-web repo so Pages serves it at /oauth.html.)

  GitHub redirects here with ?code=..&state=.. (or ?error=..). This page then:
  1. Tries to hand the payload to the desktop/mobile app via the
     scholiast://oauth deep link (silent iframe attempt + explicit button).
  2. Always shows the code for the browser-extension paste flow (the
     extension has no deep-link inbox). The Copy button copies
     "<code> <state>" — the extension verifies state when both are pasted
     and accepts a lone code otherwise.

  No secrets here, no network calls, no dependencies. The code is single-use
  and expires in ~10 minutes; this page stores nothing.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Scholiast — GitHub sign-in</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090b0d;
      color: #f4f4f5;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #111417;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #a1a1aa; margin: 0 0 16px; line-height: 1.5; }
    .codebox {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }
    code {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #090b0d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      text-align: left;
    }
    button, a.btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: #181c20;
      color: #f4f4f5;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button.primary, a.btn.primary {
      background: #0f6e56;
      border-color: #0f6e56;
      color: #fff;
    }
    .row { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .error { color: #f0526f; }
    .ok { color: #1d9e75; font-size: 12px; min-height: 18px; margin: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Scholiast GitHub sign-in</h1>
    <p id="blurb">Handing the sign-in back to Scholiast…</p>
    <div id="errorBox" class="hidden">
      <p id="errorText" class="error"></p>
    </div>
    <div id="codeBox" class="hidden">
      <div class="codebox">
        <code id="codeText"></code>
        <button type="button" id="copyBtn" class="primary">Copy</button>
      </div>
      <p class="ok" id="copyNote"></p>
      <p>Browser extension? Paste this into Settings → GitHub sync → Finish sign-in.</p>
      <div class="row">
        <a class="btn primary" id="openAppBtn" href="#">Open Scholiast app</a>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var code = q.get("code") || "";
      var state = q.get("state") || "";
      var err = q.get("error") || "";
      var errDesc = q.get("error_description") || "";

      function show(id) { document.getElementById(id).classList.remove("hidden"); }

      if (err || !code) {
        document.getElementById("blurb").textContent =
          "GitHub did not return a sign-in code.";
        document.getElementById("errorText").textContent =
          err ? ("GitHub said: " + err + (errDesc ? " — " + errDesc : "")) :
                "No code in this URL. Start again from Scholiast → Connect GitHub.";
        show("errorBox");
        return;
      }

      var deepLink = "scholiast://oauth?code=" + encodeURIComponent(code) +
        (state ? "&state=" + encodeURIComponent(state) : "");

      // Silent handoff attempt (no-ops where the app isn't installed).
      var frame = document.createElement("iframe");
      frame.style.display = "none";
      frame.src = deepLink;
      document.body.appendChild(frame);

      var openBtn = document.getElementById("openAppBtn");
      openBtn.href = deepLink;

      var bundle = state ? (code + " " + state) : code;
      document.getElementById("codeText").textContent = bundle;
      show("codeBox");
      document.getElementById("blurb").textContent =
        "If the Scholiast app didn't open, use the button — or copy the code below.";

      document.getElementById("copyBtn").addEventListener("click", function () {
        function done(ok) {
          document.getElementById("copyNote").textContent = ok
            ? "Copied — paste it into Scholiast."
            : "Copy failed — select the code manually.";
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(bundle).then(function () { done(true); }, function () { done(false); });
        } else {
          try {
            var ta = document.createElement("textarea");
            ta.value = bundle;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            done(true);
          } catch (e) { done(false); }
        }
      });
    })();
  </script>
</body>
</html>
