<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Excalidraw Editor</title>
	<link rel="stylesheet" href="excalidraw.css">
	<style>
		body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
		#app { height: 100vh; width: 100vw; }
		.top-bar {
			position: absolute;
			top: 10px;
			right: 10px;
			z-index: 1000;
			display: flex;
			align-items: center;
			gap: 10px;
		}
		/* A failed save keeps the window open and says why, rather than closing and
		   quietly losing the drawing. */
		.save-error {
			max-width: 320px;
			padding: 6px 10px;
			background: #7F1D1D;
			color: #FEE2E2;
			border-radius: 4px;
			font-size: 13px;
			line-height: 1.3;
		}
		button {
			padding: 8px 16px;
			background: #2f9e62;
			color: white;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-family: 'JetBrains Mono', ui-monospace, monospace;
			font-weight: 600;
			font-size: 12px;
			letter-spacing: 0.02em;
			transition: background 0.14s ease;
		}
		button:hover { background: #278a54; }
	</style>
</head>
<body>
	<div id="app"></div>
	<script src="browser-polyfill.min.js"></script>
	<script src="diagram.js"></script>
</body>
</html>
