<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Video Annotator</title>
	<link rel="stylesheet" href="excalidraw.css">
	<style>
		body, html {
			margin: 0; padding: 0; width: 100%; height: 100%;
			/* Solid dark background prevents paused video underneath from peeking through canvas margins */
			overflow: hidden; background: #0b0d14;
		}
		#app { width: 100%; height: 100%; }
		/* Keep Excalidraw's own canvas transparent so the dim body shows through. */
		.excalidraw, .excalidraw .layer-ui__wrapper { background: transparent !important; }
		
		/* Hide default hint text banner & toast.
		   `.HintViewer` is NOT inside .layer-ui__wrapper in current Excalidraw, so it
		   has to be matched on its own — scoping it was why "Click and drag, release
		   when you're finished" kept showing up. */
		.HintViewer,
		.excalidraw .HintViewer,
		.excalidraw .hint,
		.layer-ui__wrapper .hint,
		.layer-ui__wrapper .toast {
			display: none !important;
		}
		
		/* Custom minimal UI overlay wrapper */
		.custom-ui {
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			pointer-events: none;
			display: flex;
			flex-direction: column;
			z-index: 20;
		}
		
		/* Action buttons at top right */
		.top-right-bar {
			position: absolute;
			top: 10px;
			right: 10px;
			display: flex;
			align-items: center;
			gap: 6px;
			pointer-events: auto;
			z-index: 30;
		}
		
		.action-btn {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			height: 30px;
			padding: 0 11px;
			border-radius: 8px;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			font-size: 12px;
			font-weight: 500;
			cursor: pointer;
			border: 1px solid transparent;
			outline: none;
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			transition: background 0.14s ease-out, border-color 0.14s ease-out, transform 0.1s ease-out, box-shadow 0.14s ease-out;
		}
		
		.action-btn:active {
			transform: scale(0.97);
		}

		.btn-kbd {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, sans-serif;
			font-size: 10.5px;
			font-weight: 600;
			padding: 1px 4px;
			min-width: 16px;
			height: 16px;
			border-radius: 4px;
			line-height: 1;
			background: rgba(255, 255, 255, 0.14);
			color: currentColor;
			border: 1px solid rgba(255, 255, 255, 0.12);
		}

		.btn-kbd-primary {
			background: rgba(0, 0, 0, 0.22);
			border-color: rgba(255, 255, 255, 0.2);
		}
		.btn-kbd-lg {
			font-size: 13px;
			min-width: 19px;
			height: 19px;
			font-weight: 700;
		}

		/* Cancel: Neutral ghost style */
		.action-btn-cancel {
			background: rgba(23, 27, 38, 0.85);
			color: #d1d5db;
			border-color: rgba(255, 255, 255, 0.14);
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
		}
		.action-btn-cancel:hover {
			background: rgba(37, 43, 58, 0.95);
			color: #ffffff;
			border-color: rgba(255, 255, 255, 0.22);
		}

		/* Comment: Soft Purple Secondary Accent */
		.action-btn-comment {
			background: rgba(139, 124, 246, 0.18);
			color: #ddd6fe;
			border-color: rgba(139, 124, 246, 0.35);
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
		}
		.action-btn-comment:hover {
			background: rgba(139, 124, 246, 0.3);
			color: #ffffff;
			border-color: rgba(139, 124, 246, 0.5);
		}

		/* Save: Vibrant Primary Purple Accent */
		.action-btn-save {
			background: #8b7cf6;
			color: #ffffff;
			border-color: rgba(255, 255, 255, 0.2);
			font-weight: 600;
			box-shadow: 0 2px 10px rgba(139, 124, 246, 0.45);
		}
		.action-btn-save:hover {
			background: #7c6aed;
			box-shadow: 0 4px 14px rgba(139, 124, 246, 0.6);
		}

		/* Bottom options bar — slim, flush to the bottom edge */
		.bottom-options-bar {
			position: absolute;
			bottom: 4px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 12px;
			background: rgba(23, 27, 38, 0.92);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border-radius: 18px;
			padding: 2px 12px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			pointer-events: auto;
			align-items: center;
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
		}

		.option-group {
			position: relative;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		/* Vertical strip shown on hover */
		.option-popup {
			position: absolute;
			bottom: 100%;
			left: 50%;
			transform: translateX(-50%);
			background: transparent;
			padding-bottom: 8px; /* Transparent padding bridges the gap */
			display: none;
			flex-direction: column;
		}

		.option-popup-inner {
			background: rgba(23, 27, 38, 0.95);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border-radius: 12px;
			padding: 8px;
			display: flex;
			flex-direction: column;
			gap: 8px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
		}

		.option-group:hover .option-popup { display: flex; }

		.option-btn {
			width: 24px; height: 24px;
			border-radius: 6px;
			background: transparent;
			border: 1px solid transparent;
			color: white;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			font-size: 10px;
			transition: background 0.12s ease-out, transform 0.1s ease-out;
		}
		.option-btn:hover { background: rgba(255, 255, 255, 0.12); }
		.option-btn:active { transform: scale(0.95); }
		.option-btn.active { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.2); }
		
		/* SVGs inside option-btn */
		.option-btn svg {
			width: 18px; height: 18px;
			display: block;
		}
		
		/* Color swatch specific */
		.color-swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
		.color-swatch.active { border-color: white; box-shadow: 0 0 0 1px #000; }

		/* 1. HIDE TOP-LEFT HAMBURGER MENU (≡) AND NATIVE HELP/PROPERTIES */
		.layer-ui__wrapper .main-menu-trigger,
		.layer-ui__wrapper .dropdown-menu-button,
		.layer-ui__wrapper .App-menu_left,
		.layer-ui__wrapper .App-menu__left,
		.layer-ui__wrapper [aria-label*="menu" i],
		.layer-ui__wrapper [aria-label*="Main menu" i],
		.layer-ui__wrapper .properties-content, 
		.layer-ui__wrapper .FixedSideContainer_side_left,
		.layer-ui__wrapper .help-icon {
			display: none !important;
		}

		/* 2. REMOVE THE WHITE BOX BEHIND OUR SAVE BUTTONS.
		      The real container is `.layer-ui__wrapper__top-right` (the library /
		      collaborator island) — the FixedSideContainer_* names below never existed
		      in this version, which is why the box was still there. */
		.excalidraw .layer-ui__wrapper__top-right,
		.layer-ui__wrapper .UserList,
		.layer-ui__wrapper .zen-mode-btn {
			display: none !important;
		}

		/* Any island Excalidraw does still draw gets the dark glass treatment.
		   (The class is `Island`, capitalised — `.island` matched nothing.) */
		.excalidraw .Island {
			background: rgba(23, 27, 38, 0.9) !important;
			border: 1px solid rgba(255, 255, 255, 0.12) !important;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
		}

		/* 3. REMOVE ZOOM BUTTON (BOTTOM LEFT) */
		.layer-ui__wrapper .zoom-actions,
		.layer-ui__wrapper .zoom-actions-counter,
		.layer-ui__wrapper [aria-label*="Zoom" i] {
			display: none !important;
		}

		/* 4. REPOSITION UNDO/REDO TO BOTTOM-LEFT CORNER AND MAKE IT COMPACT & SMALLER */
		.layer-ui__wrapper .FixedSideContainer_side_bottom-left,
		.layer-ui__wrapper .FixedSideContainer_side_bottomLeft {
			bottom: 4px !important;
			left: 10px !important;
			margin: 0 !important;
			padding: 0 !important;
			display: flex !important;
			align-items: center !important;
		}

		.layer-ui__wrapper .undo-redo-actions {
			margin: 0 !important;
			padding: 0 !important;
		}

		.layer-ui__wrapper .FixedSideContainer_side_bottom-left .island,
		.layer-ui__wrapper .FixedSideContainer_side_bottomLeft .island,
		.layer-ui__wrapper .undo-redo-actions .island,
		.layer-ui__wrapper .undo-redo-buttons {
			background: rgba(23, 27, 38, 0.9) !important;
			backdrop-filter: blur(12px) !important;
			-webkit-backdrop-filter: blur(12px) !important;
			border: 1px solid rgba(255, 255, 255, 0.14) !important;
			border-radius: 6px !important;
			padding: 0 2px !important;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4) !important;
			box-sizing: border-box !important;
			height: 22px !important;
			min-height: 22px !important;
			max-height: 22px !important;
			display: flex !important;
			align-items: center !important;
			gap: 1px !important;
		}

		.layer-ui__wrapper .undo-redo-actions button,
		.layer-ui__wrapper .undo-redo-buttons button,
		.layer-ui__wrapper .FixedSideContainer_side_bottom-left button,
		.layer-ui__wrapper .FixedSideContainer_side_bottomLeft button {
			width: 22px !important;
			height: 18px !important;
			min-width: 22px !important;
			min-height: 18px !important;
			padding: 0 !important;
			border-radius: 4px !important;
			color: #e7eaf1 !important;
			background: transparent !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
			transition: background 0.12s ease-out, transform 0.1s ease-out !important;
		}

		.layer-ui__wrapper .undo-redo-actions button:hover,
		.layer-ui__wrapper .undo-redo-buttons button:hover,
		.layer-ui__wrapper .FixedSideContainer_side_bottom-left button:hover,
		.layer-ui__wrapper .FixedSideContainer_side_bottomLeft button:hover {
			background: rgba(255, 255, 255, 0.14) !important;
			color: #ffffff !important;
		}

		.layer-ui__wrapper .undo-redo-actions button:active,
		.layer-ui__wrapper .undo-redo-buttons button:active,
		.layer-ui__wrapper .FixedSideContainer_side_bottom-left button:active,
		.layer-ui__wrapper .FixedSideContainer_side_bottomLeft button:active {
			transform: scale(0.92) !important;
		}

		.layer-ui__wrapper .undo-redo-actions button svg,
		.layer-ui__wrapper .undo-redo-buttons button svg,
		.layer-ui__wrapper .FixedSideContainer_side_bottom-left button svg,
		.layer-ui__wrapper .FixedSideContainer_side_bottomLeft button svg {
			width: 12px !important;
			height: 12px !important;
		}

		/* 5. TOP TOOLBAR: Scale down and make compact so it doesn't overlap video */
		.excalidraw { --editor-container-padding: 0 !important; }

		.layer-ui__wrapper .App-toolbar {
			transform: scale(0.7) !important;
			transform-origin: top center !important;
			margin-top: 0 !important;
		}
	</style>
</head>
<body>
	<div id="app"></div>
	<script src="video-excalidraw.js"></script>
</body>
</html>
