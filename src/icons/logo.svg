<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scholiast">
  <title>Scholiast</title>

  <!-- App tile. Flat fills throughout: this renders identically everywhere and stays
       legible at favicon size, where a gradient just turns to mud. -->
  <rect width="512" height="512" rx="112" fill="#7C4DEF"/>

  <!-- The page being read, tilted slightly so it reads as a live page rather than a file icon -->
  <g transform="rotate(-4 236 256)">
    <rect x="76" y="104" width="256" height="304" rx="20" fill="#FFFFFF"/>

    <!-- Body copy -->
    <g fill="#C8C2DE">
      <rect x="108" y="148" width="192" height="14" rx="7"/>
      <rect x="108" y="180" width="152" height="14" rx="7"/>
    </g>

    <!-- The highlighted line: the one thing this extension exists for -->
    <rect x="100" y="214" width="208" height="32" rx="10" fill="#F5C518"/>
    <rect x="110" y="223" width="170" height="14" rx="7" fill="#7A6420"/>

    <g fill="#C8C2DE">
      <rect x="108" y="270" width="192" height="14" rx="7"/>
      <rect x="108" y="302" width="200" height="14" rx="7"/>
      <rect x="108" y="334" width="126" height="14" rx="7"/>
    </g>
  </g>

  <!-- The margin note beside that highlight — the "marginalia". Its tail points back
       at the page, so no connector line is needed (and none survives downscaling). -->
  <path d="M352 292 L352 256 L388 256 Z" fill="#FFFFFF"/>
  <rect x="326" y="164" width="140" height="116" rx="28" fill="#FFFFFF"/>
  <g fill="#7C4DEF">
    <rect x="354" y="198" width="84" height="14" rx="7"/>
    <rect x="354" y="228" width="58" height="14" rx="7"/>
  </g>
</svg>
