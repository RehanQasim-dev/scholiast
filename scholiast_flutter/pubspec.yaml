name: scholiast_flutter
description: "Scholiast: Web & Video Annotation and Clipping Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Persistence & Database
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Networking & Auth
  dio: ^5.8.0+1
  http: ^1.3.0

  # Utilities & Crypto
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.20.2
  ffi: ^2.1.3

  # Media & WebView
  # Pinned exact: ^6.1.5 lets pub keep a locked 6.2.0-beta, which drags in
  # flutter_inappwebview_linux (WPE-only, unbuilt on Ubuntu >= 24.04).
  flutter_inappwebview: 6.1.5
  record: ^5.2.0
  audioplayers: ^6.1.2
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/player.html
    - assets/wwwreader/android-reader.js
    - assets/wwwreader/android-reader.css
