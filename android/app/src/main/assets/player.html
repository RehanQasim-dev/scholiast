<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scholiast player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    min-width: 100%;
    min-height: 100%;
    background: #000;
    overflow: hidden;
    position: relative;
  }
  #player, iframe, #player iframe {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    min-width: 100% !important;
    min-height: 100% !important;
    border: none !important;
    display: block !important;
    pointer-events: none !important;
  }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #9AA0A6; font-family: sans-serif; font-size: 14px;
    pointer-events: none;
  }
  #loading.hidden { display: none; }
  ::cue {
    color: #ffffff !important;
    background-color: rgba(0, 0, 0, 0.88) !important;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95) !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    font-size: 16px !important;
    font-weight: 600 !important;
    line-height: 1.35 !important;
  }
  .caption-window, .ytp-caption-window-bottom, .ytp-caption-segment {
    color: #ffffff !important;
    background: rgba(8, 8, 12, 0.88) !important;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95) !important;
    border-radius: 4px !important;
    font-size: 16px !important;
    font-weight: 600 !important;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="loading">Loading player…</div>

<!-- YouTube IFrame Player API is loaded asynchronously below after callback definition -->
<script>
"use strict";

// ---------------------------------------------------------------------------
// Scholiast player page (Task 05).
//
// Bridge contract with Kotlin (object exposed as `ScholiastBridge`):
//   JS → Kotlin:
//     ScholiastBridge.onPlayerReady()
//     ScholiastBridge.onStateChange(String(state))            // YT codes -1..5
//     ScholiastBridge.onError(String(code))                   // 2, 5, 100, 101, 150
//     ScholiastBridge.onTimeUpdate(String(seconds))           // 250 ms while playing
//     ScholiastBridge.onDuration(String(seconds))
//     ScholiastBridge.onTitle(String(title))                  // player.getVideoData().title
//     ScholiastBridge.onCaptionsAvailable("true"|"false")     // best-effort (getOption tracklist)
//     ScholiastBridge.onCaptureResult(JSON.stringify({ dataUrl, w, h, error }))
//   Kotlin → JS (called by the native side):
//     commandLoadVideo(id) / commandSeekTo(s) / commandPlay() / commandPause()
//     commandSetRate(r) / commandSetVolume(v) / commandCaptureFrame()
//
// Every @JavascriptInterface method takes a single String, so JS must stringify
// everything (multi-arg JS→Java calls get comma-joined, which is fragile).
// ---------------------------------------------------------------------------

var player = null;
var ready = false;
var apiReady = false;
var pendingVideoId = null;
var currentLoadedVideoId = null;
var timeTimer = null;
var lastRate = 1;
var lastVolume = 100;
var lastCaptionsEnabled = true;

function origin() {
  return 'https://scholiast.app';
}

function injectIframeStyles() {
  try {
    var iframe = (player && player.getIframe) ? player.getIframe() : document.querySelector('iframe');
    if (!iframe) return;
    var doc = iframe.contentDocument || (iframe.contentWindow ? iframe.contentWindow.document : null);
    if (!doc) return;

    if (!doc.getElementById('scholiast-yt-cleaner')) {
      var style = doc.createElement('style');
      style.id = 'scholiast-yt-cleaner';
      style.textContent = `
        .ytp-chrome-top,
        .ytp-chrome-bottom,
        .ytp-watermark,
        .ytp-pause-overlay,
        .ytp-pause-overlay-container,
        .ytp-gradient-top,
        .ytp-gradient-bottom,
        .ytp-show-cards-title,
        .ytp-title,
        .ytp-title-channel,
        .ytp-ce-element,
        .ytp-cards-teaser,
        .ytp-endscreen-content,
        .html5-endscreen,
        .ytp-contextmenu,
        .ytp-impression-link,
        .ytp-paid-content-overlay,
        .ytp-cairo-refresh-signature-moments,
        .ytp-button.ytp-share-button,
        .ytp-overflow-button,
        .ytp-more-videos-view,
        .ytp-upnext,
        .ytp-tooltip,
        .ytp-videowall,
        .ytp-autonav-endscreen-upnext-container,
        .ytp-bezel,
        .ytp-bezel-text-wrapper,
        .ytp-fullscreen-grid,
        .ytp-fullscreen-grid-percentage,
        .ytp-featured-product,
        .ytp-merch-shelf,
        .ytp-popup,
        .ytp-menu-container,
        .ytp-skip-intro-button,
        .ytp-cards-button,
        .ytp-multicam-button,
        .ytp-remote-button,
        .ytp-size-button,
        .ytp-subtitles-button,
        .ytp-player-content,
        .ytp-flyout-cta,
        .ytp-suggested-action-badge,
        .ytp-youtube-button {
          display: none !important;
          opacity: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
        }
        /* Raise captions above our bottom control row; transform composes with
           YouTube's inline positioning, so it wins without fighting it. */
        .ytp-caption-window-container { transform: translateY(-56px) !important; }
        ::cue {
          color: #ffffff !important;
          background-color: rgba(8, 8, 12, 0.88) !important;
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95) !important;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
          font-size: 16px !important;
          font-weight: 600 !important;
          line-height: 1.35 !important;
        }
        .caption-window, .ytp-caption-window-bottom, .ytp-caption-segment {
          color: #ffffff !important;
          background: rgba(8, 8, 12, 0.88) !important;
          text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95) !important;
          border-radius: 4px !important;
          font-size: 16px !important;
          font-weight: 600 !important;
        }
      `;
      (doc.head || doc.documentElement).appendChild(style);
    }
  } catch (e) {}
}

setInterval(injectIframeStyles, 300);

function createPlayer(videoId) {
  if (player || !apiReady || !videoId) return;
  currentLoadedVideoId = videoId;
  var loadingEl = document.getElementById('loading');
  if (loadingEl) loadingEl.classList.add('hidden');
  player = new YT.Player('player', {
    width: '100%',
    height: '100%',
    videoId: videoId,
    playerVars: {
      origin: origin(),
      rel: 0,                 // don't show related videos
      playsinline: 1,         // REQUIRED on Android WebView: no forced fullscreen
      controls: 0,            // all chrome lives in Compose
      fs: 0,                  // no YouTube fullscreen button
      modestbranding: 1,
      iv_load_policy: 3,
      disablekb: 1,
      enablejsapi: 1,
      autoplay: 1
    },
    events: {
      onReady: onReady,
      onStateChange: onStateChange,
      onError: onError
    }
  });
}

// ------------------------------ Kotlin → JS --------------------------------

function commandLoadVideo(id) {
  console.log('[ScholiastJS] commandLoadVideo:', id, 'ready:', ready, 'apiReady:', apiReady);
  if (!id) return;
  pendingVideoId = id;
  if (!player && apiReady) {
    createPlayer(id);
    return;
  }
  if (ready && player) {
    if (currentLoadedVideoId === id) {
      console.log('[ScholiastJS] Video already loaded, commanding play');
      commandPlay();
      return;
    }
    currentLoadedVideoId = id;
    try {
      console.log('[ScholiastJS] player.loadVideoById:', id);
      player.loadVideoById(id);
    } catch (e) {
      console.error('[ScholiastJS] loadVideoById error:', e);
    }
    setTimeout(function () {
      if (ready && player) {
        try { player.setPlaybackRate(lastRate); } catch (e) {}
        try { player.setVolume(lastVolume); } catch (e) {}
        reportCaptions();
      }
    }, 1500);
  }
}

function commandSeekTo(s) {
  console.log('[ScholiastJS] commandSeekTo:', s);
  if (ready && player) {
    var state = -1;
    try { state = player.getPlayerState(); } catch (e) {}
    var wasPlaying = (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING);
    try {
      player.seekTo(s, true);
      if (wasPlaying) {
        player.playVideo();
      }
    } catch (e) {}
  }
}

function commandPlay() {
  console.log('[ScholiastJS] commandPlay called, ready:', ready);
  if (ready && player) {
    try {
      player.playVideo();
      console.log('[ScholiastJS] player.playVideo() executed');
    } catch (e) {
      console.error('[ScholiastJS] player.playVideo() threw:', e);
    }
    try {
      var iframe = player.getIframe();
      if (iframe) {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        var video = doc ? doc.querySelector('video') : null;
        if (video) {
          console.log('[ScholiastJS] HTML5 video found. Paused:', video.paused);
          if (video.paused) {
            var p = video.play();
            if (p && p.catch) {
              p.catch(function(err) {
                console.error('[ScholiastJS] video.play() promise rejected:', err);
              });
            }
          }
        }
      }
    } catch (e) {
      console.error('[ScholiastJS] HTML5 video fallback error:', e);
    }
  }
}

function commandPause() {
  console.log('[ScholiastJS] commandPause called');
  if (ready && player) {
    try {
      player.pauseVideo();
    } catch (e) {}
    try {
      var iframe = player.getIframe();
      if (iframe) {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        var video = doc ? doc.querySelector('video') : null;
        if (video && !video.paused) {
          video.pause();
        }
      }
    } catch (e) {}
  }
}

function commandSetRate(r) {
  lastRate = r;
  if (ready && player) { try { player.setPlaybackRate(r); } catch (e) {} }
}

function commandSetVolume(v) {
  lastVolume = v;
  if (ready && player) { try { player.setVolume(v); } catch (e) {} }
}

function commandSetCaptions(enabled) {
  console.log('[ScholiastJS] commandSetCaptions:', enabled);
  lastCaptionsEnabled = (enabled === true || enabled === 'true' || enabled === 1);
  if (ready && player) {
    applyCaptions(lastCaptionsEnabled);
  }
}

function applyCaptions(enabled) {
  if (!player) return;
  try {
    if (enabled) {
      player.loadModule("captions");
      try { player.setOption('captions', 'fontSize', 1); } catch (e) {}
      var tracks = player.getOption('captions', 'tracklist') || [];
      if (tracks.length > 0) {
        player.setOption('captions', 'track', tracks[0] || { languageCode: 'en' });
      } else {
        player.setOption('captions', 'track', { languageCode: 'en' });
      }
    } else {
      player.unloadModule("captions");
      player.setOption('captions', 'track', {});
    }
  } catch (e) {
    console.error('[ScholiastJS] applyCaptions error:', e);
  }
  try {
    var iframe = player.getIframe();
    if (iframe) {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      var video = doc ? doc.querySelector('video') : null;
      if (video && video.textTracks) {
        for (var i = 0; i < video.textTracks.length; i++) {
          video.textTracks[i].mode = enabled ? 'showing' : 'hidden';
        }
      }
    }
  } catch (e) {}
}

function commandCaptureFrame() { captureFrame(); }

// ------------------------------- IFrame API ---------------------------------

function onYouTubeIframeAPIReady() {
  console.log('[ScholiastJS] onYouTubeIframeAPIReady called! pendingVideoId:', pendingVideoId);
  apiReady = true;
  if (pendingVideoId) {
    createPlayer(pendingVideoId);
  }
}

function onReady(e) {
  console.log('[ScholiastJS] onReady fired! currentLoadedVideoId:', currentLoadedVideoId);
  ready = true;
  try { player.setPlaybackRate(lastRate); } catch (e) {}
  try { player.setVolume(lastVolume); } catch (e) {}
  applyCaptions(lastCaptionsEnabled);
  injectIframeStyles();
  if (window.ScholiastBridge && window.ScholiastBridge.onPlayerReady) {
    ScholiastBridge.onPlayerReady();
  }
  reportMetadata();
  setTimeout(function() {
    reportCaptions();
    applyCaptions(lastCaptionsEnabled);
    injectIframeStyles();
  }, 1000);
  setTimeout(function() { reportCaptions(); injectIframeStyles(); }, 3000);
  setTimeout(function() { reportCaptions(); injectIframeStyles(); }, 6000);
}

function onStateChange(e) {
  console.log('[ScholiastJS] onStateChange: ' + e.data + ' (ready=' + ready + ')');
  injectIframeStyles();
  if (window.ScholiastBridge && window.ScholiastBridge.onStateChange) {
    ScholiastBridge.onStateChange(String(e.data));
  }
  if (e.data === YT.PlayerState.PLAYING) {
    reportMetadata();
    reportCaptions();
    startTimeTimer();
  } else if (e.data === YT.PlayerState.PAUSED) {
    stopTimeTimer();
    injectIframeStyles();
  } else if (e.data === YT.PlayerState.ENDED) {
    stopTimeTimer();
    injectIframeStyles();
    try {
      if (window.ScholiastBridge && window.ScholiastBridge.onTimeUpdate) {
        ScholiastBridge.onTimeUpdate(String(player.getDuration() || 0));
      }
    } catch (err) {}
  }
}

function onError(e) {
  console.error('[ScholiastJS] onError: ' + e.data);
  stopTimeTimer();
  if (window.ScholiastBridge && window.ScholiastBridge.onError) {
    ScholiastBridge.onError(String(e.data));
  }
}

function reportMetadata() {
  try {
    var data = player.getVideoData();
    if (data && data.title && window.ScholiastBridge && window.ScholiastBridge.onTitle) {
      ScholiastBridge.onTitle(String(data.title));
    }
  } catch (e) {}
  try {
    var d = player.getDuration();
    if (d > 0 && window.ScholiastBridge && window.ScholiastBridge.onDuration) {
      ScholiastBridge.onDuration(String(d));
    }
  } catch (e) {}
}

// Best-effort caption detection (not part of the public IFrame API surface).
function reportCaptions() {
  try {
    var tracks = player.getOption('captions', 'tracklist') || [];
    var has = Array.isArray(tracks) && tracks.length > 0;
    if (window.ScholiastBridge && window.ScholiastBridge.onCaptionsAvailable) {
      ScholiastBridge.onCaptionsAvailable(has ? 'true' : 'false');
    }
  } catch (e) {
    if (window.ScholiastBridge && window.ScholiastBridge.onCaptionsAvailable) {
      ScholiastBridge.onCaptionsAvailable('false');
    }
  }
}

function startTimeTimer() {
  if (timeTimer) return;
  timeTimer = setInterval(function () {
    if (!ready || !player) return;
    try {
      if (window.ScholiastBridge && window.ScholiastBridge.onTimeUpdate) {
        ScholiastBridge.onTimeUpdate(String(player.getCurrentTime()));
      }
    } catch (e) {}
  }, 250);
}

function stopTimeTimer() {
  if (timeTimer) { clearInterval(timeTimer); timeTimer = null; }
}

// -------------------------------- Frame capture ------------------------------
//
// The <video> element lives inside the cross-origin YouTube iframe. The native
// host enables WebView "universal access from file URLs", so contentWindow is
// readable and the canvas stays un-tainted. Errors are reported through
// onCaptureResult with a non-empty `error`:
//   'capture-unavailable'  — player/video not ready (called too early)
//   'black'                — rendered frame is >98% black (DRM/embed-blocked)
//   'tainted'              — canvas SecurityError (drawImage/toDataURL threw)

function captureFrame() {
  if (!ready || !player) {
    failCapture('capture-unavailable');
    return;
  }
  var iframe = null;
  try { iframe = player.getIframe(); } catch (e) {}
  if (!iframe) { failCapture('capture-unavailable'); return; }

  var video = null;
  try {
    var doc = iframe.contentDocument || iframe.contentWindow.document;
    video = doc.querySelector('video');
  } catch (e) {
    failCapture('capture-unavailable');
    return;
  }
  if (!video || !video.videoWidth || !video.videoHeight) {
    failCapture('capture-unavailable');
    return;
  }

  try { player.pauseVideo(); } catch (e) {}

  // Let the paused frame settle before drawing it.
  setTimeout(function () {
    var w = video.videoWidth;
    var h = video.videoHeight;
    var cw = Math.min(w, 1280);                 // downscale to ≤1280px (plan §10)
    var ch = Math.max(1, Math.round(cw * h / (w || 1)));
    var canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext('2d');
    if (!ctx) { failCapture('canvas-unavailable'); return; }
    try {
      ctx.drawImage(video, 0, 0, cw, ch);
      if (isBlackFrame(ctx, cw, ch)) {
        failCapture('black');
        return;
      }
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      if (window.ScholiastBridge && window.ScholiastBridge.onCaptureResult) {
        ScholiastBridge.onCaptureResult(JSON.stringify({
          dataUrl: dataUrl, w: cw, h: ch, error: ''
        }));
      }
    } catch (e) {
      failCapture('tainted');
    }
  }, 300);
}

function failCapture(reason) {
  if (window.ScholiastBridge && window.ScholiastBridge.onCaptureResult) {
    ScholiastBridge.onCaptureResult(JSON.stringify({
      dataUrl: '', w: 0, h: 0, error: reason
    }));
  }
}

function isBlackFrame(ctx, w, h) {
  if (w <= 0 || h <= 0) return true;
  var step = 8;
  var data = ctx.getImageData(0, 0, w, h);
  var px = data.data;
  var n = 0, black = 0;
  for (var y = 0; y < h; y += step) {
    for (var x = 0; x < w; x += step) {
      var i = (y * w + x) * 4;
      if (px[i] < 16 && px[i + 1] < 16 && px[i + 2] < 16) black++;
      n++;
    }
  }
  return n > 0 && (black / n) > 0.98;
}

// Asynchronously load the YouTube IFrame Player API
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
</script>
</body>
</html>
